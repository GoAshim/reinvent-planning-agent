<svg xmlns="http://www.w3.org/2000/svg" width="960" height="552" viewBox="0 0 960 552" role="img" aria-label="Hand-built agent loop architecture">
<style>
  svg { --surface:#ffffff; --fg:#18212d; --muted:#526073; --line:#6f7d90;
    --code:#2c58cc; --code-bg:#e9effd; --code-wash:#f3f6fe; --fw:#0d8478; --fw-bg:#e1f3f0;
    --ext:#b0650f; --ext-bg:#fbefe0; --data:#56677c; --data-bg:#eceff3;
    --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#161b23; --fg:#e5e9ef; --muted:#9ba6b5; --line:#8794a6;
      --code:#86a6ff; --code-bg:#1b2541; --code-wash:#141b2c; --fw:#4fc6b7; --fw-bg:#11302c;
      --ext:#e9a650; --ext-bg:#33240f; --data:#a3b2c5; --data-bg:#1f262f; }
  }
  .bg { fill: var(--surface); }
  .c-code { fill: var(--code-bg); stroke: var(--code); stroke-width: 1.5; }
  .c-fw { fill: var(--fw-bg); stroke: var(--fw); stroke-width: 1.5; }
  .c-ext { fill: var(--ext-bg); stroke: var(--ext); stroke-width: 1.5; }
  .c-data { fill: var(--data-bg); stroke: var(--data); stroke-width: 1.5; }
  .c-wrap { fill: var(--code-wash); stroke: var(--code); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .c-pill { fill: var(--surface); stroke: var(--fw); stroke-width: 1.5; }
  .t-title { font: 600 13px var(--sans); fill: var(--fg); }
  .t-small { font: 600 12px var(--sans); fill: var(--fg); }
  .t-mono { font: 11.5px var(--mono); fill: var(--muted); }
  .t-label { font: 11px var(--sans); fill: var(--muted); }
  .t-num { font: 600 13px var(--mono); fill: var(--code); }
  .t-num-fw { font: 600 13px var(--mono); fill: var(--fw); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .head { fill: var(--line); }
</style>
<rect class="bg" width="960" height="552" rx="10"/>
        <defs>
          <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="head" d="M0,0 L10,5 L0,10 z"/>
          </marker>
        </defs>

        <!-- caller -->
        <rect class="c-code" x="20" y="62" width="170" height="60" rx="6"/>
        <text class="t-title" x="105" y="86" text-anchor="middle">Test script</text>
        <text class="t-mono" x="105" y="106" text-anchor="middle">run_agent_loop(prompt)</text>

        <!-- agent.py container -->
        <rect class="c-wrap" x="220" y="20" width="450" height="320" rx="10"/>
        <text class="t-title" x="238" y="44">src/agent.py · run_agent_loop()</text>

        <rect class="c-code" x="270" y="62" width="370" height="44" rx="6"/>
        <text x="286" y="89"><tspan class="t-num">1</tspan><tspan class="t-title" dx="10">Start the message list with the user prompt</tspan></text>

        <rect class="c-code" x="270" y="122" width="370" height="48" rx="6"/>
        <text x="286" y="141"><tspan class="t-num">2</tspan><tspan class="t-title" dx="10">Call the model</tspan></text>
        <text class="t-mono" x="306" y="160">bedrock_client.converse(messages, ...)</text>

        <rect class="c-code" x="270" y="186" width="370" height="62" rx="6"/>
        <text x="286" y="205"><tspan class="t-num">3</tspan><tspan class="t-title" dx="10">Read stopReason</tspan></text>
        <text class="t-mono" x="306" y="223">tool_use → step 4</text>
        <text class="t-mono" x="306" y="239">end_turn → return · max_tokens → error</text>

        <rect class="c-code" x="270" y="264" width="370" height="56" rx="6"/>
        <text x="286" y="284"><tspan class="t-num">4</tspan><tspan class="t-title" dx="10">Run tools, append results</tspan></text>
        <text class="t-mono" x="306" y="304">toolResult → back to step 2</text>

        <!-- loop back -->
        <path class="edge" d="M270,292 H244 V146 H270" marker-end="url(#m1)"/>
        <text class="t-label" x="234" y="220" text-anchor="middle" transform="rotate(-90 234 220)">max 5 iterations</text>

        <!-- prompt in / answer out -->
        <path class="edge" d="M190,84 H270" marker-end="url(#m1)"/>
        <text class="t-label" x="205" y="77" text-anchor="middle">prompt</text>
        <path class="edge" d="M220,217 H105 V122" marker-end="url(#m1)"/>
        <text class="t-label" x="114" y="236">final answer</text>

        <!-- right column -->
        <rect class="c-code" x="720" y="20" width="220" height="56" rx="6"/>
        <text class="t-title" x="830" y="43" text-anchor="middle">src/bedrock_client.py</text>
        <text class="t-mono" x="830" y="62" text-anchor="middle">boto3 · profile reinvent</text>
        <path class="edge" d="M830,76 V96" marker-end="url(#m1)"/>

        <rect class="c-ext" x="720" y="96" width="220" height="86" rx="6"/>
        <text class="t-title" x="830" y="124" text-anchor="middle">Amazon Bedrock</text>
        <text class="t-mono" x="830" y="144" text-anchor="middle">Converse API</text>
        <text class="t-mono" x="830" y="162" text-anchor="middle">Claude Haiku 4.5</text>

        <path class="edge" d="M640,138 H720" marker-end="url(#m1)"/>
        <text class="t-label" x="680" y="131" text-anchor="middle">request</text>
        <path class="edge" d="M720,160 H640" marker-end="url(#m1)"/>
        <text class="t-label" x="680" y="178" text-anchor="middle">response</text>

        <rect class="c-code" x="720" y="206" width="220" height="78" rx="6"/>
        <text class="t-title" x="830" y="230" text-anchor="middle">src/tool_definitions.py</text>
        <text class="t-mono" x="830" y="250" text-anchor="middle">AGENT_TOOLS</text>
        <text class="t-mono" x="830" y="268" text-anchor="middle">hand-written JSON schemas</text>
        <path class="edge" d="M720,245 H670" marker-end="url(#m1)"/>
        <text class="t-label" x="695" y="238" text-anchor="middle">schemas</text>

        <!-- bottom row -->
        <path class="edge" d="M300,320 V400" marker-end="url(#m1)"/>
        <text class="t-label" x="293" y="366" text-anchor="end">toolUse</text>
        <path class="edge" d="M360,400 V320" marker-end="url(#m1)"/>
        <text class="t-label" x="367" y="366">toolResult</text>

        <rect class="c-code" x="230" y="400" width="190" height="92" rx="6"/>
        <text class="t-title" x="325" y="428" text-anchor="middle">src/tool_dispatcher.py</text>
        <text class="t-mono" x="325" y="450" text-anchor="middle">execute_tool(name, input)</text>
        <text class="t-mono" x="325" y="468" text-anchor="middle">if / elif on tool name</text>

        <path class="edge" d="M420,446 H460" marker-end="url(#m1)"/>

        <rect class="c-code" x="460" y="400" width="190" height="92" rx="6"/>
        <text class="t-title" x="555" y="428" text-anchor="middle">src/tools.py</text>
        <text class="t-mono" x="555" y="448" text-anchor="middle">search_sessions</text>
        <text class="t-mono" x="555" y="465" text-anchor="middle">get_session_details</text>
        <text class="t-mono" x="555" y="482" text-anchor="middle">check_conflict</text>

        <path class="edge" d="M650,446 H720" marker-end="url(#m1)"/>
        <text class="t-label" x="685" y="439" text-anchor="middle">SQL</text>

        <rect class="c-data" x="720" y="400" width="220" height="92" rx="6"/>
        <text class="t-title" x="830" y="430" text-anchor="middle">data/sessions.db</text>
        <text class="t-mono" x="830" y="450" text-anchor="middle">SQLite · 1,099 sessions</text>
        <text class="t-mono" x="830" y="468" text-anchor="middle">parameterized queries</text>

        <!-- legend -->
        <g transform="translate(20 522)">
          <rect class="c-code" width="14" height="14" rx="3"/><text class="t-label" x="22" y="11">My code</text>
          <rect class="c-ext" x="110" width="14" height="14" rx="3"/><text class="t-label" x="132" y="11">External service</text>
          <rect class="c-data" x="250" width="14" height="14" rx="3"/><text class="t-label" x="272" y="11">Data store</text>
        </g>
      </svg>
